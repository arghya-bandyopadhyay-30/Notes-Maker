[tool.poetry]
name = "essentialprojects"
version = "0.1.0"
description = ""
authors = ["Arghya Bandyopadhyay <arghya.bandyopadhyay.official1@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.virtualenvs]
in-project = true

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
youtube-transcript-api = "^1.2.4"
ollama = "^0.6.2"
yt-dlp = "^2026.7.4"
pyyaml = "^6.0"
openai-whisper = "^20250625"
transformers = "^5.15.0"
torchaudio = "^2.11.0"
onnxruntime = "^1.28.0"
onnx = "^1.22.0"
nemo-toolkit = {extras = ["asr"], version = "^3.0.0"}
faster-whisper = "^1.2.1"
langchain-core = "^1.5.6"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16"
pre-commit = "^4.6"
pytest = "^8.2"
mypy = "^1.11"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]
fixable = ["ALL"]
unfixable = ["TID251"]  # cannot auto-fix wildcard imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.isort]
known-first-party = ["src"]
known-third-party = ["pydantic", "yt_dlp", "yaml", "ollama", "whisper", "faster_whisper", "transformers", "torch", "onnxruntime", "onnx", "nemo", "langchain_core"]
known-local-folder = ["src"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
strict_equality = false
explicit_package_bases = true
ignore_missing_imports = true
allow_untyped_decorators = true
