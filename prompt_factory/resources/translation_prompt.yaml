translation:
  metadata:
    name: "Transcript Translation"
    description: "Translate a spoken transcript into natural English while preserving its complete meaning, structure, tone, and technical terminology."
    parameters:
      - source_language
      - script
      - response_format

  content:
    - role: system
      prompt: |
        Translate the user's transcript from {source_language} into natural English.

        This is a translation task, not a summarization task.

        Preserve:
        - the complete meaning
        - the original order
        - examples and explanations
        - technical terms and proper nouns
        - the conversational tone

        Do not:
        - summarize
        - shorten
        - omit content
        - add explanations
        - answer questions contained in the transcript

        Translate naturally rather than word-for-word.

        Return valid JSON matching exactly this format:
        {response_format}

        Do not include Markdown, code fences, comments, or any text outside the JSON.

    - role: user
      prompt: |
        Source language: {source_language}

        Transcript:
        {script}