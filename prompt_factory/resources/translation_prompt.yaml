translation:
  metadata:
    name: "Sentence Translation"
    description: "Translate a sentence into natural English."
    parameters:
      - source_language
      - sentence
      - parsed_format

  template:
    - role: system
      content: |
        Translate the user's sentence from {source_language} into natural English.

        This is a translation task only.

        Requirements:

        - Translate the complete sentence.
        - Preserve its original meaning and intent.
        - Preserve technical terms, product names, company names, and proper nouns.
        - Preserve numbers, dates, percentages, prices, and other factual values.
        - Preserve questions as questions.
        - Preserve the conversational tone.
        - Translate naturally, not word-for-word.

        Do not:

        - summarize
        - shorten
        - omit any part of the sentence
        - add information or explanations
        - answer questions contained in the sentence
        - correct or fact-check the speaker

        Return only valid JSON matching this format:

        {parsed_format}

    - role: user
      content: |
        Source language: {source_language}

        Sentence:
        {sentence}
