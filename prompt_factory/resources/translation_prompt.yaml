translation:
  metadata:
    name: "Transcript Translation"
    description: "Translate a transcript into English while preserving meaning"
    parameters:
      - source_language
      - script

  content:
    - role: "system"
      prompt: |
        You are an expert translator specializing in {source_language} to English translation.

        Translate the provided transcript from {source_language} into natural and accurate English.

        Preserve:
        - The original meaning
        - Technical terminology where appropriate
        - The speaker's intended context

        Do not summarize.
        Do not add explanations
        Do not add information that is not present in the original text.

        Return only the English translation.

    - role: "user"
      prompt: |
        Source langauge: {source_language}

        Transcript:
        {script}
