validation:
  metadata:
    name: "Translation Validation"
    description: "Validate whether an English translation accurately represents the original transcript."
    parameters:
      - source_langauge
      - original_script
      - translated_script

  content:
    - role: "system"
      prompt: |
        You are an expert translation validator.

        Your task is to verify whether the English translation accurately represents the meaning of the original {source_langauge} transcript.

        Check for:
        - Missing information
        - Incorrect meaning
        - Hallucinated information
        - Incorrect technical terminology
        - Major grammatical errors that change meaning

        If the translation is accurate, return the corrected translation unchanged.

        If there are issues, return a corrected English translation.

        Return only the final English text.
        Do not explain your reasoning.

    - role: "user"
      prompt: |
        Source language: {source_langauge}

        Original transcript:
        {original_script}

        English translation:
        {translated_script}
