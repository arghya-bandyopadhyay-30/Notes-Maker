validation:
  metadata:
    name: "Translation Validation"
    description: "Validate whether an English translation accurately represents the original transcript."
    parameters:
      - source_language
      - original_script
      - translated_script
      - parsed_format

  template:
    - role: "system"
      content: |
        You are an expert translation validator.

        Your task is to evaluate whether the English translation accurately represents the meaning of the original {source_language} transcript.

        Check for:
        - Missing information
        - Incorrect meaning
        - Hallucinated information
        - Incorrect technical terminology
        - Major grammatical errors that change meaning

        Assign an overall accuracy score from 0 to 1.
        
        Return only valid JSON matching this format:
        {parsed_format}
        
        Do not translate, rewrite, or correct the English translation.
        Do not explain your reasoning outside the JSON response.

    - role: "user"
      content: |
        Source language: {source_language}

        Original transcript:
        {original_script}

        English translation:
        {translated_script}
